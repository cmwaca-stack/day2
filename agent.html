<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      background: #f2f4f7;
      font-family: 'Malgun Gothic', sans-serif;
    }
    .chat {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
    .chat-header {
      padding: 14px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      background: #ff8a3d;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff8ef;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.me {
      align-self: flex-end;
      background: #ff8a3d;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.agent {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border: 1px solid #eee;
      border-bottom-left-radius: 4px;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #eee;
    }
    #input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    #input:focus { border-color: #ff8a3d; }
    form button {
      padding: 0 18px;
      font-size: 1rem;
      border: 0;
      border-radius: 20px;
      background: #ff8a3d;
      color: #fff;
      cursor: pointer;
    }
    .notice {
      padding: 6px;
      text-align: center;
      font-size: 0.7rem;
      color: #999;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div class="chat">
    <div class="chat-header">🍊 제주 특산물 에이전트</div>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
      <button type="submit">보내기</button>
    </form>
    <div class="notice">※ Gemini AI가 답해요. 가격·운영 정보는 직접 확인하세요.</div>
  </div>

  <script>
    const history = [];   // 서버(/api/chat)로 보낼 대화 기록 [{ role: 'user' | 'agent', text }]

    const messages = document.getElementById('messages');
    const input = document.getElementById('input');

    function addBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // 처음 열었을 때 화면이 비어 보이지 않도록 안내 말풍선을 하나 보여 준다 (대화 기록에는 포함되지 않음)
    addBubble('안녕하세요! 아래 입력창에 메시지를 써서 보내 보세요 👇', 'agent');

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, 'me');
      input.value = '';
      history.push({ role: 'user', text });

      const wait = addBubble('...', 'agent');
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '요청 실패');
        wait.textContent = data.reply;
        history.push({ role: 'agent', text: data.reply });
      } catch (err) {
        wait.textContent = '답변을 가져오지 못했어요: ' + err.message;
        history.pop();   // 실패한 질문은 기록에서 뺀다
      }
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
